app = "vyro-lite"
primary_region = "sin"

[build]

[env]
  VYRO_ENV = "production"
  VYRO_HOST = "0.0.0.0"
  VYRO_DATA_DIR = "/data"
  VYRO_VAULT_DIR = "/data/vault"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
